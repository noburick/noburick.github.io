<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Noburick Realm 作品カタログ</title>
  <meta name="description" content="Noburick Realmの配信中・テスター募集中・開発中の作品をまとめたショーケースです。">
  <link rel="stylesheet" href="style.css">
  <script src="apps.js" defer></script>
</head>
<body>
  <header class="hero">
    <div class="hero__inner">
      <p class="hero__badge">Noburick Realm</p>
      <h1>作品カタログ</h1>
      <p class="hero__lead">配信中の作品、テスター募集中の作品、開発中の作品をスマホでも見やすく一覧できます。</p>
      <ul class="hero__status-list" aria-label="ステータス一覧">
        <li class="status-badge status-badge--released">🟢 配信中</li>
        <li class="status-badge status-badge--testing">🟡 テスター募集中</li>
        <li class="status-badge status-badge--developing">🔵 開発中</li>
      </ul>
    </div>
  </header>

  <main class="container">
    <section class="catalog-section" aria-labelledby="catalog-title">
      <div class="section-heading">
        <p class="section-heading__eyebrow">Showcase</p>
        <h2 id="catalog-title">作品一覧</h2>
        <p class="section-heading__lead">カードの情報を追加するだけで、新しい作品を同じレイアウトで並べられます。</p>
      </div>
      <div class="apps-grid" id="apps" aria-label="作品一覧"></div>
    </section>
  </main>

  <template id="app-card-template">
    <article class="app-card">
      <div class="app-card__body">
        <p class="status-badge"></p>
        <div class="app-card__thumb">
          <img loading="lazy">
        </div>
        <div class="app-card__content">
          <h3 class="app-card__title"></h3>
          <p class="app-card__summary"></p>
        </div>
        <div class="app-card__actions"></div>
      </div>
    </article>
  </template>

  <footer class="footer">
    <p>© 2026 Noburick Realm</p>
  </footer>
</body>
</html>
